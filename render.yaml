services:
  - type: web
    name: al-shamel-net
    env: node
    plan: free
    region: frankfurt
    buildCommand: npm install --legacy-peer-deps --include=dev && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: VITE_APP_ID
        value: al-shamel-services
      - key: OWNER_OPEN_ID
        value: admin-nabel-7720079495
