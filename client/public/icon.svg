<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Royal Navy -->
    <linearGradient id="luxuryBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#072348"/>
      <stop offset="50%" stop-color="#051731"/>
      <stop offset="100%" stop-color="#020d1c"/>
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="metallicGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Dark Blue Nodes -->
    <linearGradient id="nodeBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Center Radial Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="36%" r="45%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#072348" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="luxuryShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#f59e0b" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 1. Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#luxuryBg)"/>
  <rect width="512" height="512" rx="112" fill="url(#centerGlow)"/>

  <!-- 2. Dual Gold Metallic Border -->
  <rect x="8" y="8" width="496" height="496" rx="106" fill="none" stroke="url(#metallicGold)" stroke-width="8" opacity="0.95"/>
  <rect x="22" y="22" width="468" height="468" rx="94" fill="none" stroke="#f59e0b" stroke-width="3" opacity="0.45"/>

  <!-- 3. Central Circular White Badge with Gold Rim -->
  <circle cx="256" cy="190" r="130" fill="#ffffff" filter="url(#luxuryShadow)"/>
  <circle cx="256" cy="190" r="130" fill="none" stroke="url(#metallicGold)" stroke-width="6"/>
  <circle cx="256" cy="190" r="124" fill="none" stroke="#fde68a" stroke-width="2" opacity="0.7"/>

  <!-- 4. Official Al-Shamel Constellation Network Emblem -->
  <!-- Outer Ring Contour -->
  <circle cx="256" cy="190" r="92" fill="none" stroke="#0a2540" stroke-width="7" stroke-dasharray="8 6" opacity="0.25"/>

  <!-- Interconnecting Network Lines -->
  <g stroke="#0a2540" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <line x1="256" y1="122" x2="204" y2="152"/>
    <line x1="256" y1="122" x2="308" y2="152"/>
    <line x1="204" y1="152" x2="190" y2="210"/>
    <line x1="308" y1="152" x2="322" y2="210"/>
    <line x1="190" y1="210" x2="230" y2="248"/>
    <line x1="322" y1="210" x2="282" y2="248"/>
    <line x1="230" y1="248" x2="282" y2="248"/>
    <line x1="256" y1="122" x2="256" y2="190"/>
    <line x1="204" y1="152" x2="256" y2="190"/>
    <line x1="308" y1="152" x2="256" y2="190"/>
    <line x1="230" y1="248" x2="256" y2="190"/>
    <line x1="282" y1="248" x2="256" y2="190"/>
  </g>

  <!-- Gold Accent Connectors -->
  <g stroke="#f59e0b" stroke-width="4" stroke-linecap="round" opacity="0.95">
    <line x1="204" y1="152" x2="322" y2="210"/>
    <line x1="308" y1="152" x2="190" y2="210"/>
  </g>

  <!-- Network Nodes (Blue & Gold Metallic Spheres) -->
  <!-- Center Hub Node (Gold) -->
  <circle cx="256" cy="190" r="16" fill="url(#metallicGold)" stroke="#ffffff" stroke-width="3" filter="url(#goldGlow)"/>

  <!-- Top Center Node (Blue) -->
  <circle cx="256" cy="122" r="13" fill="url(#nodeBlue)" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Upper Left Node (Gold) -->
  <circle cx="204" cy="152" r="14" fill="url(#metallicGold)" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Upper Right Node (Blue) -->
  <circle cx="308" cy="152" r="14" fill="url(#nodeBlue)" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Mid Left Node (Blue) -->
  <circle cx="190" cy="210" r="13" fill="url(#nodeBlue)" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Mid Right Node (Gold) -->
  <circle cx="322" cy="210" r="14" fill="url(#metallicGold)" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Lower Left Node (Gold) -->
  <circle cx="230" cy="248" r="13" fill="url(#metallicGold)" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Lower Right Node (Blue) -->
  <circle cx="282" cy="248" r="13" fill="url(#nodeBlue)" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Mini Decorative Particles -->
  <circle cx="224" cy="128" r="4" fill="#f59e0b"/>
  <circle cx="288" cy="128" r="4" fill="#0284c7"/>
  <circle cx="178" cy="180" r="4" fill="#f59e0b"/>
  <circle cx="334" cy="180" r="4" fill="#0284c7"/>

  <!-- 5. Luxury Typography: "الشامل" in Gold & "لخدمات الإنترنت" in White -->
  <text x="256" y="388" font-family="'Cairo', 'Segoe UI', Tahoma, sans-serif" font-size="62" font-weight="900" fill="url(#metallicGold)" text-anchor="middle" filter="url(#goldGlow)" letter-spacing="1">الشامل</text>
  
  <text x="256" y="442" font-family="'Cairo', 'Segoe UI', Tahoma, sans-serif" font-size="24" font-weight="700" fill="#e2e8f0" text-anchor="middle" letter-spacing="4" opacity="0.95">لخدمات الإنترنت</text>

  <!-- Micro English Subtitle -->
  <text x="256" y="472" font-family="'Cairo', sans-serif" font-size="13" font-weight="800" fill="#94a3b8" text-anchor="middle" letter-spacing="3" opacity="0.8">AL SHAMEL SERVICES</text>
</svg>
